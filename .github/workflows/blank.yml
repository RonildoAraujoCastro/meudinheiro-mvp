
import unittest

def calcular_saldo(receitas, despesas):
    return receitas - despesas

class TestMeuDinheiro(unittest.TestCase):
    def test_calcular_saldo(self):
        self.assertEqual(calcular_saldo(2500, 120), 2380)

    def test_saldo_sem_despesas(self):
        self.assertEqual(calcular_saldo(2500, 0), 2500)

    def test_saldo_zero(self):
        self.assertEqual(calcular_saldo(0, 0), 0)

if __name__ == "__main__":
    unittest.main()

